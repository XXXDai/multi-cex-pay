name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # 显式指定数据目录，避免测试往仓库里写文件
        env:
          CEXPAY_DATA_DIR: ${{ runner.temp }}/cexpay-data
        run: pytest -q

  sdks:
    name: SDK lint (node / go / php)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        run: node --check sdk/node/cexpay.mjs

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: sdk/go/go.sum
      - name: go vet
        working-directory: sdk/go
        run: go build ./... && go vet ./...

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: php -l
        run: php -l sdk/php/CexPayClient.php

  sdk-signature:
    name: 跨语言签名一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install
        run: pip install -e ".[dev]"

      # 四种语言的 verify_webhook 必须和服务端 sign_payload 算出同一个结果
      - name: Cross-language signature test
        env:
          CEXPAY_DATA_DIR: ${{ runner.temp }}/cexpay-data
        run: pytest tests/test_sdk_signature.py -v -rs

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: multi-cex-pay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name cexpay-ci -p 8787:8787 \
            -e CEXPAY_HOST=0.0.0.0 -e CEXPAY_POLL_INTERVAL=0 \
            multi-cex-pay:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              echo "healthy"; curl -s http://127.0.0.1:8787/api/health; exit 0
            fi
            sleep 2
          done
          echo "服务没起来，容器日志："; docker logs cexpay-ci; exit 1
